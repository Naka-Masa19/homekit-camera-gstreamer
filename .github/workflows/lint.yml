name: Lint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check ."

      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check ."
