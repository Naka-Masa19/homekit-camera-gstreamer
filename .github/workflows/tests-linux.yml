name: Tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        debian-version: ["12", "13"]

    runs-on: ubuntu-slim
    container:
      image: debian:${{ matrix.debian-version }}

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: apt install -y gstreamer1.0-plugins-good gstreamer1.0-plugins-bad libgstreamer1.0-0 gir1.2-gst-plugins-base-1.0 python3-gst-1.0 python3-gi python3-pip python3-pytest gir1.2-gdkpixbuf-2.0

      - name: Install module
        run: pip install . --break-system-packages

      - name: Test module
        run: pytest -s -o log_cli=true --log-cli-level=INFO
