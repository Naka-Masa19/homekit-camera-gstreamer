name: Tests (Debian)

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        debian-version: ["12", "13"]

    runs-on: ubuntu-latest
    container:
      image: debian:${{ matrix.debian-version }}

    steps:
      - uses: actions/checkout@v5

      - name: Update packuage list
        run: apt-get update

      - name: Install dependencies
        run: apt-get install -y python3-pip python3-gst-1.0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad python3-pytest gir1.2-gdkpixbuf-2.0 --no-install-recommends

      - name: Install module
        run: pip install . --break-system-packages

      - name: Test module
        run: pytest
