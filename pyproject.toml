[project]
name = "homekit-camera-gstreamer"
version = "1.1"
requires-python = ">=3.10"
dependencies = [
    "HAP-Python>=5.0.0",
    "gstreamer-meta>=1.28.0; sys_platform == 'darwin' or sys_platform == 'win32'",
]
license =  { file = "LICENSE" }
readme = "README.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"src/gst_camera/__init__.py" = ["E402"]
